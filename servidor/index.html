<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EstudiaPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F1F3EE; --papel-2:#E6E9E2; --tinta:#141F1A; --tinta-3:#5C6A62;
  --marca:#E8E34A; --violeta:#544A8C; --linea:#C9CFC5; --alerta:#B4432B;
  --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--papel);color:var(--tinta);font:400 16px/1.55 var(--sans);
  min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2.5px solid var(--violeta);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Trazo de marcador: el gesto de subrayar apuntes, no un rectángulo */
.marca{position:relative;display:inline-block}
.marca::before{content:'';position:absolute;inset:-2px -7px -3px -5px;background:var(--marca);
  border-radius:38% 62% 55% 45%/50% 40% 60% 50%;transform:rotate(-.7deg);z-index:-1;opacity:.85}

header{border-bottom:1.5px solid var(--tinta);padding:14px 20px;display:flex;
  align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--papel);
  position:sticky;top:0;z-index:20}
header h1{font:900 25px/1 var(--serif);font-variation-settings:'opsz' 100;letter-spacing:-.02em}
header .sub{font:400 12px/1 var(--mono);color:var(--tinta-3);text-transform:uppercase;letter-spacing:.13em}
header .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{font:500 11px/1 var(--mono);padding:5px 9px;border:1.5px solid var(--linea);
  border-radius:2px;color:var(--tinta-3)}
.chip.ok{border-color:var(--tinta);color:var(--tinta)}

main{flex:1;display:grid;grid-template-columns:290px 1fr;min-height:0}
@media (max-width:880px){main{grid-template-columns:1fr}}

/* ── Columna de sesiones ── */
aside{border-right:1.5px solid var(--linea);padding:20px 16px;overflow-y:auto}
@media (max-width:880px){aside{border-right:none;border-bottom:1.5px solid var(--linea);max-height:none}}
.rotulo{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;
  color:var(--tinta-3);margin-bottom:12px;display:flex;justify-content:space-between}
.sesion{width:100%;text-align:left;padding:11px 12px;border:1.5px solid transparent;
  border-radius:3px;margin-bottom:3px;transition:background .12s}
.sesion:hover{background:var(--papel-2)}
.sesion[aria-current="true"]{background:var(--papel-2);border-color:var(--tinta)}
.sesion .t{font-weight:500;font-size:14.5px;line-height:1.35;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sesion .m{font:400 11px/1 var(--mono);color:var(--tinta-3);
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.punto{width:5px;height:5px;border-radius:50%;background:var(--tinta-3);flex:none}

/* ── Panel principal ── */
section.panel{padding:26px 30px 60px;overflow-y:auto;max-width:920px}
@media (max-width:880px){section.panel{padding:22px 18px 50px}}

.captura{border:1.5px solid var(--tinta);border-radius:4px;padding:20px;margin-bottom:30px;
  background:var(--papel)}
.modos{display:flex;gap:2px;margin-bottom:18px;flex-wrap:wrap}
.modo{font:500 13px/1 var(--sans);padding:8px 14px;border:1.5px solid var(--linea);
  border-radius:2px;color:var(--tinta-3)}
.modo[aria-pressed="true"]{border-color:var(--tinta);color:var(--tinta);background:var(--papel-2)}
.campo{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:3px;
  background:var(--papel);margin-bottom:9px}
.campo:focus{border-color:var(--tinta);outline:none}
textarea.campo{min-height:130px;resize:vertical;font-size:14.5px;line-height:1.5}
.fila{display:flex;gap:9px;flex-wrap:wrap}
.fila>.campo{flex:1;min-width:150px}

.btn{font:600 14px/1 var(--sans);padding:11px 20px;border:1.5px solid var(--tinta);
  border-radius:3px;background:var(--tinta);color:var(--papel);transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.fantasma{background:none;color:var(--tinta)}
.btn.chico{font-size:12.5px;padding:7px 13px}

/* Grabadora: la onda es el único elemento animado de la interfaz */
.grabadora{display:flex;align-items:center;gap:16px;padding:16px 0}
.rec{width:58px;height:58px;border-radius:50%;background:var(--alerta);flex:none;
  display:grid;place-items:center;border:none}
.rec span{width:20px;height:20px;background:var(--papel);border-radius:50%;transition:all .2s}
.rec[data-on="true"] span{border-radius:2px;width:17px;height:17px}
.onda{flex:1;height:44px;display:flex;align-items:center;gap:2.5px;overflow:hidden}
.onda i{flex:1;background:var(--tinta);min-height:3px;border-radius:1px;
  transform:scaleY(.12);transform-origin:center;transition:transform .09s ease-out}
.reloj{font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums;flex:none}

/* ── Pestañas de artefactos ── */
.cabeza{margin-bottom:22px;padding-bottom:16px;border-bottom:1.5px solid var(--linea)}
.cabeza h2{font:600 30px/1.14 var(--serif);font-variation-settings:'opsz' 60;
  letter-spacing:-.015em;margin-bottom:8px}
.cabeza .meta{font:400 12px/1 var(--mono);color:var(--tinta-3);display:flex;gap:10px;
  flex-wrap:wrap;align-items:center}
.pestanas{display:flex;gap:3px;margin-bottom:24px;flex-wrap:wrap;
  border-bottom:1.5px solid var(--linea);padding-bottom:0}
.pes{font:500 14px/1 var(--sans);padding:10px 14px;border-bottom:2.5px solid transparent;
  color:var(--tinta-3);margin-bottom:-1.5px}
.pes[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--tinta);font-weight:600}
.pes .listo{color:var(--violeta);font-size:11px;vertical-align:super}

.vacio{padding:44px 22px;text-align:center;border:1.5px dashed var(--linea);border-radius:4px}
.vacio p{color:var(--tinta-3);margin-bottom:16px;font-size:14.5px}

/* Notas en Markdown */
.notas h2{font:600 22px/1.25 var(--serif);margin:26px 0 10px;letter-spacing:-.01em}
.notas h2:first-child{margin-top:0}
.notas h3{font:600 16.5px/1.3 var(--sans);margin:18px 0 7px}
.notas ul{margin:0 0 12px 19px}
.notas li{margin-bottom:5px;font-size:15.5px}
.notas p{margin-bottom:12px;font-size:15.5px}
.notas blockquote{border-left:3px solid var(--marca);padding:3px 0 3px 15px;margin:14px 0;
  font-size:15.5px}
.notas code{font:400 13.5px var(--mono);background:var(--papel-2);padding:1px 5px;border-radius:2px}
.notas strong{font-weight:600}

/* Quiz */
.preg{border:1.5px solid var(--linea);border-radius:4px;padding:17px 18px;margin-bottom:12px}
.preg .n{font:500 11px/1 var(--mono);color:var(--tinta-3);letter-spacing:.1em;margin-bottom:7px}
.preg .q{font-weight:500;margin-bottom:13px;font-size:16px;line-height:1.45}
.op{display:block;width:100%;text-align:left;padding:10px 13px;border:1.5px solid var(--linea);
  border-radius:3px;margin-bottom:6px;font-size:14.5px;line-height:1.4}
.op:hover:not(:disabled){border-color:var(--tinta)}
.op:disabled{cursor:default}
.op.bien{border-color:var(--tinta);background:var(--marca)}
.op.mal{border-color:var(--alerta);color:var(--alerta)}
.porque{font-size:14px;line-height:1.5;padding:11px 13px;background:var(--papel-2);
  border-radius:3px;margin-top:9px}
.marcador{font:500 13px/1 var(--mono);padding:13px 0;border-top:1.5px solid var(--tinta);
  margin-top:8px;display:flex;justify-content:space-between}

/* Flashcards */
.baraja{display:flex;flex-direction:column;align-items:center;gap:18px}
.carta{width:100%;max-width:480px;height:265px;perspective:1400px;cursor:pointer}
.cara-cont{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.1,.2,1);
  transform-style:preserve-3d}
.carta[data-volteada="true"] .cara-cont{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;border:1.5px solid var(--tinta);
  border-radius:5px;padding:32px 28px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;background:var(--papel)}
.cara.atras{transform:rotateY(180deg);background:var(--papel-2)}
.cara .tema{font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;
  color:var(--tinta-3);position:absolute;top:16px;left:0;right:0}
.cara .txt{font:400 20px/1.4 var(--serif);font-variation-settings:'opsz' 40}
.cara.atras .txt{font-family:var(--sans);font-size:16.5px;line-height:1.5}
.cara .pista{font:400 11px/1 var(--mono);color:var(--tinta-3);position:absolute;bottom:15px}
.mandos{display:flex;gap:9px;align-items:center}

/* Podcast */
.pod{border:1.5px solid var(--tinta);border-radius:4px;padding:22px}
.pod audio{width:100%;margin:16px 0}
.turno{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:14.5px}
.turno:last-child{border:none}
.turno .voz{font:500 11px/1.7 var(--mono);flex:none;width:46px;color:var(--tinta-3)}
.turno.b .voz{color:var(--violeta)}

.cargando{display:flex;align-items:center;gap:11px;padding:34px 0;
  font:400 14px var(--mono);color:var(--tinta-3)}
.giro{width:15px;height:15px;border:2px solid var(--linea);border-top-color:var(--tinta);
  border-radius:50%;animation:g .75s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.error{border:1.5px solid var(--alerta);border-radius:3px;padding:12px 14px;
  color:var(--alerta);font-size:14px;margin-bottom:14px}
.fila-sesion{display:flex;align-items:stretch;gap:2px;margin-bottom:3px}
.fila-sesion .sesion{flex:1;margin-bottom:0}
.tirar{width:30px;flex:none;border:1.5px solid transparent;border-radius:3px;
  color:var(--tinta-3);font-size:19px;line-height:1;opacity:0;transition:opacity .12s}
.fila-sesion:hover .tirar,.tirar:focus-visible{opacity:1}
.tirar:hover{border-color:var(--alerta);color:var(--alerta)}
@media (hover:none){.tirar{opacity:.55}}
.oculto{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Estudia<span style="font-weight:400;font-style:italic">Pro</span></h1>
  <span class="sub">Clases → material de estudio</span>
  <div class="der">
    <span class="chip" id="estado">conectando</span>
    <button class="btn fantasma chico" id="btnConfig">Ajustes</button>
  </div>
</header>

<main>
  <aside>
    <div class="rotulo"><span>Sesiones</span><span id="conteo"></span></div>
    <div id="lista"></div>
  </aside>

  <section class="panel">
    <div id="alerta"></div>

    <!-- Captura -->
    <div class="captura" id="captura">
      <div class="modos" role="group" aria-label="Fuente del material">
        <button class="modo" data-modo="grabar" aria-pressed="true">Grabar clase</button>
        <button class="modo" data-modo="audio" aria-pressed="false">Subir audio</button>
        <button class="modo" data-modo="pdf" aria-pressed="false">PDF</button>
        <button class="modo" data-modo="link" aria-pressed="false">Link o video</button>
        <button class="modo" data-modo="texto" aria-pressed="false">Pegar texto</button>
      </div>

      <div class="fila">
        <input class="campo" id="titulo" placeholder="Título de la clase">
        <input class="campo" id="materia" placeholder="Materia" style="max-width:190px">
      </div>

      <div id="mGrabar">
        <div class="grabadora">
          <button class="rec" id="btnRec" data-on="false" aria-label="Empezar a grabar"><span></span></button>
          <div class="onda" id="onda"></div>
          <div class="reloj" id="reloj">00:00</div>
        </div>
        <p style="font:400 12.5px var(--mono);color:var(--tinta-3)">
          El audio se transcribe en tu servidor y no se guarda en ningún lado.
        </p>
      </div>

      <div id="mAudio" class="oculto">
        <input type="file" class="campo" id="archAudio" accept="audio/*,video/*">
        <button class="btn" id="btnAudio">Transcribir</button>
      </div>

      <div id="mPdf" class="oculto">
        <input type="file" class="campo" id="archPdf" accept="application/pdf">
        <button class="btn" id="btnPdf">Leer PDF</button>
      </div>

      <div id="mLink" class="oculto">
        <input class="campo" id="url" placeholder="https://… o link de YouTube">
        <button class="btn" id="btnLink">Traer contenido</button>
      </div>

      <div id="mTexto" class="oculto">
        <textarea class="campo" id="pegado" placeholder="Pega aquí el texto de la clase"></textarea>
        <button class="btn" id="btnTexto">Guardar</button>
      </div>

      <div id="progreso"></div>
    </div>

    <!-- Sesión abierta -->
    <div id="sesion" class="oculto">
      <div class="cabeza">
        <h2 id="sTitulo"></h2>
        <div class="meta" id="sMeta"></div>
      </div>
      <div class="pestanas" role="tablist" id="pestanas"></div>
      <div id="contenido"></div>
    </div>
  </section>
</main>

<script>
/* ───────────────── Config con degradación a memoria ───────────────── */
const mem = {};
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch { mem[k] = v; } };
const leer = k => { try { return localStorage.getItem(k) ?? mem[k] ?? ''; } catch { return mem[k] || ''; } };

let TOKEN = leer('token') || 'estudia_dev';

document.getElementById('btnConfig').onclick = () => {
  const t = prompt('Token', TOKEN);
  if (t !== null) { TOKEN = t.trim(); guardar('token', TOKEN); }
  cargarSesiones();
};

/* ─────────────────────────── Utilidades ───────────────────────────── */
const $ = id => document.getElementById(id);

async function api(ruta, opts = {}) {
  const r = await fetch(ruta, {
    ...opts,
    headers: { 'x-app-token': TOKEN, ...(opts.body instanceof FormData ? {} : { 'content-type': 'application/json' }), ...opts.headers },
  });
  const d = await r.json().catch(() => ({ error: 'Respuesta ilegible del servidor' }));
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

function avisar(msg) {
  $('alerta').innerHTML = msg ? `<div class="error">${msg}</div>` : '';
  if (msg) $('alerta').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function cargando(donde, texto) {
  $(donde).innerHTML = `<div class="cargando"><div class="giro"></div>${texto}</div>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function md(txt) {
  return esc(txt)
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
    .replace(/^ {2,}[-*] (.+)$/gm, '<li style="margin-left:18px">$1</li>')
    .replace(/(<li[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .split(/\n{2,}/).map(b => /^<(h2|h3|ul|blockquote)/.test(b.trim()) ? b : (b.trim() ? `<p>${b}</p>` : ''))
    .join('');
}

/* ──────────────────────── Selector de modo ────────────────────────── */
const MODOS = ['grabar', 'audio', 'pdf', 'link', 'texto'];
document.querySelectorAll('.modo').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.modo').forEach(x => x.setAttribute('aria-pressed', x === b));
    MODOS.forEach(m => $('m' + m[0].toUpperCase() + m.slice(1)).classList.toggle('oculto', m !== b.dataset.modo));
    avisar('');
  };
});

/* ────────────────────────── Grabadora ─────────────────────────────── */
const onda = $('onda');
for (let i = 0; i < 56; i++) onda.appendChild(document.createElement('i'));
const barras = [...onda.children];

let rec = null, trozos = [], t0 = 0, cron = null, ctxAudio = null, raf = null;

$('btnRec').onclick = async () => {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    const flujo = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
    });
    trozos = [];
    rec = new MediaRecorder(flujo, { mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm' });
    rec.ondataavailable = e => e.data.size && trozos.push(e.data);
    rec.onstop = async () => {
      flujo.getTracks().forEach(t => t.stop());
      clearInterval(cron); cancelAnimationFrame(raf);
      if (ctxAudio) { ctxAudio.close(); ctxAudio = null; }
      barras.forEach(b => b.style.transform = 'scaleY(.12)');
      $('btnRec').dataset.on = 'false';
      await transcribir(new Blob(trozos, { type: 'audio/webm' }));
    };
    rec.start(1000);
    $('btnRec').dataset.on = 'true';
    t0 = Date.now();
    cron = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $('reloj').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 500);
    dibujarOnda(flujo);
    avisar('');
  } catch (e) {
    avisar('No se pudo abrir el micrófono. Revisa los permisos del navegador.');
  }
};

function dibujarOnda(flujo) {
  ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
  const an = ctxAudio.createAnalyser();
  an.fftSize = 256;
  ctxAudio.createMediaStreamSource(flujo).connect(an);
  const datos = new Uint8Array(an.frequencyBinCount);
  let desp = 0;
  const historia = new Array(barras.length).fill(0.12);
  (function paso() {
    an.getByteFrequencyData(datos);
    const nivel = datos.reduce((a, b) => a + b, 0) / datos.length / 255;
    historia[desp % historia.length] = Math.max(0.12, Math.min(1, nivel * 3.4));
    desp++;
    for (let i = 0; i < barras.length; i++) {
      barras[i].style.transform = `scaleY(${historia[(desp + i) % historia.length]})`;
    }
    raf = requestAnimationFrame(paso);
  })();
}

async function transcribir(blob) {
  const min = (blob.size / 1024 / 1024).toFixed(1);
  cargando('progreso', `Transcribiendo ${min} MB. Una clase de una hora tarda unos 4 minutos…`);
  try {
    // El servidor transcribe y crea la sesión en una sola llamada
    const fd = new FormData();
    fd.append('audio', blob, blob.name || 'clase.webm');
    fd.append('titulo', $('titulo').value || `Clase del ${new Date().toLocaleDateString('es-MX')}`);
    fd.append('materia', $('materia').value);
    const r = await fetch('/api/transcribir', {
      method: 'POST', headers: { 'x-app-token': TOKEN }, body: fd,
    });
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || 'Falló la transcripción');
    $('progreso').innerHTML = '';
    $('reloj').textContent = '00:00';
    await cargarSesiones();
    abrir(s.id);
  } catch (e) {
    $('progreso').innerHTML = '';
    avisar(e.message);
  }
}

$('btnAudio').onclick = () => {
  const f = $('archAudio').files[0];
  if (!f) return avisar('Elige un archivo de audio primero.');
  transcribir(f);
};

/* ───────────────────── Otras fuentes de ingesta ───────────────────── */
$('btnPdf').onclick = async () => {
  const f = $('archPdf').files[0];
  if (!f) return avisar('Elige un PDF primero.');
  cargando('progreso', 'Leyendo el PDF…');
  try {
    const fd = new FormData();
    fd.append('archivo', f);
    fd.append('titulo', $('titulo').value);
    fd.append('materia', $('materia').value);
    const s = await api('/api/sesion/pdf', { method: 'POST', body: fd });
    $('progreso').innerHTML = '';
    await cargarSesiones(); abrir(s.id);
  } catch (e) { $('progreso').innerHTML = ''; avisar(e.message); }
};

$('btnLink').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) return avisar('Pega una URL primero.');
  const esYT = /(?:v=|youtu\.be\/|shorts\/)[\w-]{11}/.test(url);
  cargando('progreso', esYT
    ? 'Identificando el video e investigando el tema…'
    : 'Trayendo el contenido…');
  try {
    const s = await api('/api/sesion/link', {
      method: 'POST',
      body: JSON.stringify({ url, titulo: $('titulo').value, materia: $('materia').value }),
    });
    $('progreso').innerHTML = '';
    await cargarSesiones(); abrir(s.id);
  } catch (e) { $('progreso').innerHTML = ''; avisar(e.message); }
};

$('btnTexto').onclick = async () => {
  const texto = $('pegado').value.trim();
  if (texto.length < 120) return avisar('Pega al menos un par de párrafos.');
  try {
    const s = await api('/api/sesion/texto', {
      method: 'POST',
      body: JSON.stringify({ titulo: $('titulo').value || 'Texto pegado', materia: $('materia').value, texto }),
    });
    $('pegado').value = '';
    await cargarSesiones(); abrir(s.id);
  } catch (e) { avisar(e.message); }
};

/* ────────────────────── Lista de sesiones ─────────────────────────── */
let sesiones = [], actual = null;
const ICONO = { audio: 'Clase', pdf: 'PDF', link: 'Artículo', video: 'Video', web: 'Investigado', texto: 'Texto' };

async function cargarSesiones() {
  try {
    sesiones = await api('/api/sesiones');
    $('estado').textContent = 'listo';
    $('estado').className = 'chip ok';
  } catch (e) {
    $('estado').textContent = 'sin conexión';
    return avisar(e.message.includes('Token') ? 'Token inválido. Ábrelo en Ajustes.' : e.message);
  }
  $('conteo').textContent = sesiones.length || '';
  $('lista').innerHTML = sesiones.length ? sesiones.map(s => `
    <div class="fila-sesion">
      <button class="sesion" data-id="${s.id}" aria-current="${String(s.id) === String(actual)}">
        <div class="t">${esc(s.titulo)}</div>
        <div class="m">
          <span>${ICONO[s.fuente] || s.fuente}</span><span class="punto"></span>
          <span>${s.palabras.toLocaleString('es-MX')} palabras</span>
          ${s.materia ? `<span class="punto"></span><span>${esc(s.materia)}</span>` : ''}
        </div>
      </button>
      <button class="tirar" data-tirar="${s.id}" title="Borrar" aria-label="Borrar ${esc(s.titulo)}">×</button>
    </div>`).join('')
    : `<p style="color:var(--tinta-3);font-size:14px">Todavía no hay nada. Graba una clase o sube un PDF para empezar.</p>`;
  document.querySelectorAll('.sesion').forEach(b => b.onclick = () => abrir(b.dataset.id));
  document.querySelectorAll('[data-tirar]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const id = b.dataset.tirar;
    const s = sesiones.find(x => String(x.id) === String(id));
    if (!confirm(`¿Borrar "${s?.titulo || 'esta sesión'}"?\n\nSe van también sus notas, quiz y flashcards.`)) return;
    try {
      await api(`/api/sesion/${id}`, { method: 'DELETE' });
      if (String(actual) === String(id)) { actual = null; $('sesion').classList.add('oculto'); }
      await cargarSesiones();
    } catch (e) { avisar(e.message); }
  });
}

/* ──────────────────────── Vista de sesión ─────────────────────────── */
const TABS = [
  { id: 'notas', et: 'Notas' }, { id: 'resumen', et: 'Resumen' },
  { id: 'quiz', et: 'Quiz' }, { id: 'flashcards', et: 'Flashcards' },
  { id: 'podcast', et: 'Podcast' },
];
let datos = null, tab = 'notas';

async function abrir(id) {
  actual = String(id); avisar('');
  $('sesion').classList.remove('oculto');
  cargando('contenido', 'Abriendo…');
  document.querySelectorAll('.sesion').forEach(b => b.setAttribute('aria-current', b.dataset.id === String(id)));
  try {
    datos = await api(`/api/sesion/${id}`);
  } catch (e) { return avisar(e.message); }
  $('sTitulo').textContent = datos.titulo;
  $('sMeta').innerHTML = [
    ICONO[datos.fuente] || datos.fuente,
    `${datos.palabras.toLocaleString('es-MX')} palabras`,
    new Date(datos.creado).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' }),
    datos.materia,
  ].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span class="punto"></span>');
  $('pestanas').innerHTML = TABS.map(t => `
    <button class="pes" role="tab" data-t="${t.id}" aria-selected="${t.id === tab}">
      ${t.et}${datos.artefactos[t.id] ? '<span class="listo">●</span>' : ''}
    </button>`).join('');
  document.querySelectorAll('.pes').forEach(b => b.onclick = () => { tab = b.dataset.t; pintar(); });
  pintar();
  $('sesion').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.addEventListener('click', e => {
  if (e.target.dataset?.gen) generar(e.target.dataset.gen, e.target.dataset.rehacer === '1');
});

async function generar(tipo, rehacer) {
  cargando('contenido', tipo === 'podcast' ? 'Escribiendo el guion y grabando las voces. Esto tarda…' : 'Claude está trabajando…');
  try {
    if (tipo === 'podcast') {
      const d = await api('/api/podcast', { method: 'POST', body: JSON.stringify({ sesion_id: actual }) });
      datos.audio = d.audio;
      const g = await api(`/api/sesion/${actual}`);
      datos.artefactos = g.artefactos;
    } else {
      const d = await api('/api/generar', { method: 'POST', body: JSON.stringify({ sesion_id: actual, tipo, rehacer }) });
      datos.artefactos[tipo] = d.contenido;
    }
    document.querySelectorAll('.pes').forEach(b => {
      if (datos.artefactos[b.dataset.t] && !b.querySelector('.listo')) {
        b.insertAdjacentHTML('beforeend', '<span class="listo">●</span>');
      }
    });
    pintar();
  } catch (e) {
    pintar();
    avisar(e.message);
  }
}

function pintar() {
  document.querySelectorAll('.pes').forEach(b => b.setAttribute('aria-selected', b.dataset.t === tab));
  const c = $('contenido'), a = datos.artefactos[tab];
  const etiqueta = TABS.find(t => t.id === tab).et.toLowerCase();

  if (!a && !(tab === 'podcast' && datos.audio)) {
    c.innerHTML = `<div class="vacio">
      <p>Todavía no generas ${etiqueta} de esta sesión.</p>
      <button class="btn" data-gen="${tab}">Generar ${etiqueta}</button>
    </div>`;
    return;
  }

  if (tab === 'notas' || tab === 'resumen') {
    c.innerHTML = `<div class="notas">${md(a.markdown)}</div>
      <div style="margin-top:26px;display:flex;gap:8px">
        <button class="btn fantasma chico" data-gen="${tab}" data-rehacer="1">Volver a generar</button>
        <button class="btn fantasma chico" id="copiar">Copiar</button>
      </div>`;
    $('copiar').onclick = () => {
      navigator.clipboard.writeText(a.markdown);
      $('copiar').textContent = 'Copiado';
      setTimeout(() => $('copiar').textContent = 'Copiar', 1600);
    };
  }

  if (tab === 'quiz') pintarQuiz(c, a.preguntas);
  if (tab === 'flashcards') pintarCartas(c, a.tarjetas);
  if (tab === 'podcast') pintarPodcast(c, a);
}

/* ─────────────────────────── Quiz ─────────────────────────────────── */
function pintarQuiz(c, preguntas) {
  let bien = 0, hechas = 0;
  c.innerHTML = `<div id="qs"></div>
    <div class="marcador"><span id="score">0 de ${preguntas.length}</span>
    <button class="btn fantasma chico" data-gen="quiz" data-rehacer="1">Otro quiz</button></div>`;
  $('qs').innerHTML = preguntas.map((p, i) => `
    <div class="preg" data-i="${i}">
      <div class="n">${String(i + 1).padStart(2, '0')} / ${String(preguntas.length).padStart(2, '0')}</div>
      <div class="q">${esc(p.pregunta)}</div>
      ${p.opciones.map((o, j) => `<button class="op" data-j="${j}">${esc(o)}</button>`).join('')}
      <div class="porque oculto">${esc(p.porque || '')}</div>
    </div>`).join('');

  $('qs').querySelectorAll('.preg').forEach((caja, i) => {
    caja.querySelectorAll('.op').forEach(op => {
      op.onclick = () => {
        const j = +op.dataset.j, ok = j === preguntas[i].correcta;
        caja.querySelectorAll('.op').forEach(x => {
          x.disabled = true;
          if (+x.dataset.j === preguntas[i].correcta) x.classList.add('bien');
        });
        if (!ok) op.classList.add('mal');
        caja.querySelector('.porque').classList.remove('oculto');
        hechas++; if (ok) bien++;
        $('score').textContent = `${bien} de ${preguntas.length}` + (hechas === preguntas.length ? ' · terminado' : '');
      };
    });
  });
}

/* ──────────────────────── Flashcards ──────────────────────────────── */
function pintarCartas(c, tarjetas) {
  let i = 0, volteada = false;
  c.innerHTML = `<div class="baraja">
      <div class="carta" id="carta" data-volteada="false" role="button" tabindex="0">
        <div class="cara-cont">
          <div class="cara"><div class="tema" id="tema"></div><div class="txt" id="frente"></div>
            <div class="pista">Toca para ver la respuesta</div></div>
          <div class="cara atras"><div class="txt" id="reverso"></div></div>
        </div>
      </div>
      <div class="mandos">
        <button class="btn fantasma chico" id="ant">← Anterior</button>
        <span style="font:500 13px var(--mono);min-width:78px;text-align:center" id="pos"></span>
        <button class="btn fantasma chico" id="sig">Siguiente →</button>
      </div>
      <div class="mandos">
        <button class="btn fantasma chico" id="fallo">No la sabía</button>
        <button class="btn chico" id="acierto">La sabía</button>
      </div>
      <button class="btn fantasma chico" data-gen="flashcards" data-rehacer="1">Rehacer baraja</button>
    </div>`;

  const mostrar = () => {
    volteada = false;
    $('carta').dataset.volteada = 'false';
    setTimeout(() => {
      $('frente').textContent = tarjetas[i].frente;
      $('reverso').textContent = tarjetas[i].reverso;
      $('tema').textContent = tarjetas[i].tema || '';
    }, volteada ? 250 : 0);
    $('pos').textContent = `${i + 1} / ${tarjetas.length}`;
  };
  const voltear = () => { volteada = !volteada; $('carta').dataset.volteada = volteada; };
  const mover = d => { i = (i + d + tarjetas.length) % tarjetas.length; mostrar(); };

  $('carta').onclick = voltear;
  $('carta').onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); voltear(); } };
  $('ant').onclick = () => mover(-1);
  $('sig').onclick = () => mover(1);
  $('acierto').onclick = () => { calificar(i, true); mover(1); };
  $('fallo').onclick = () => { calificar(i, false); mover(1); };
  mostrar();
}

function calificar(indice, acerto) {
  api('/api/repaso', { method: 'POST', body: JSON.stringify({ sesion_id: actual, indice, acerto }) }).catch(() => {});
}

/* ───────────────────────── Podcast ────────────────────────────────── */
function pintarPodcast(c, a) {
  const turnos = a?.turnos || [];
  c.innerHTML = `<div class="pod">
      ${datos.audio
        ? `<audio controls src="${datos.audio}"></audio>`
        : `<p style="color:var(--tinta-3);font-size:14.5px;margin-bottom:14px">
             El guion está listo. Genera el audio para escucharlo en el camino.</p>
           <button class="btn" data-gen="podcast">Grabar el audio</button>`}
      <div style="margin-top:20px">${turnos.map(t => `
        <div class="turno ${t.voz === 'B' ? 'b' : ''}">
          <span class="voz">${t.voz === 'B' ? 'Dalia' : 'Jorge'}</span>
          <span>${esc(t.texto)}</span>
        </div>`).join('')}
      </div>
    </div>`;
}

cargarSesiones();
</script>
</body>
</html>
